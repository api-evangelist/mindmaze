aid: mindmaze
name: MindMaze
description: 'MindMaze Therapeutics Holding SA (SIX: MMTX) is a Swiss precision-neurotherapeutics
  company headquartered in Lausanne, with a Geneva holding entity and a US base in Charlotte,
  North Carolina. Founded in 2012 by Tej Tadi as an EPFL spin-off, MindMaze became Switzerland''s
  first unicorn and in December 2025 its successor entity NeuroX completed a business
  combination with Relief Therapeutics to form the SIX-listed MindMaze Therapeutics.
  The company builds digital neurotherapeutics that pair gamified therapy software with
  proprietary sensors and AI-driven analytics across the continuum of care - in-hospital,
  outpatient and at home - for stroke, Parkinson''s disease and at-risk aging. Its FDA-listed
  and CE-marked portfolio includes Companion, MindMotion GO, MindPod, the Izar smart hand
  peripheral, the Physilog 3D motion-analytics platform and TOAP Run, deployed in more
  than 250 clinics and rehabilitation centers globally. MindMaze is a regulated medical-device
  and digital-therapeutics vendor rather than a software platform business: as of 2026-08-01
  it publishes no developer portal, no API documentation, no SDKs, no CLI and no product API
  contract, and no API, docs or developer subdomain resolves on its domains. The one
  machine-readable surface it does serve is the anonymous WordPress REST API behind its
  corporate site, which carries 450 posts - 309 of them EQS regulatory and investor-relations
  disclosure for the SIX-listed issuer - 49 pages and 1,070 media records.'
