apis:
- name: MindMaze Therapeutics Content API
  description: >-
    The public, anonymous WordPress REST API behind mindmazetherapeutics.com. It is not a
    MindMaze product, clinical or device API - none exists - but it is a real machine-readable
    surface, and because MindMaze Therapeutics Holding SA is listed on the SIX Swiss Exchange
    (MMTX) it carries the company's regulatory disclosure stream: 309 EQS posts, 162 EQS ad-hoc
    announcements, 147 other investor-relations items, 27 press releases, 92 in-the-media
    entries, 17 events, 7 testimonials and 2 product announcements, alongside 49 marketing,
    platform, product and research pages and 1,070 media records including investor-presentation
    and financial-report PDFs. Every operation captured here was verified to return HTTP 200
    anonymously on 2026-08-01; write and administrative routes exist on the host but return 401
    rest_forbidden and are deliberately excluded, as is /wp/v2/users, which exposes author
    personal data anonymously.
  humanURL: https://mindmazetherapeutics.com/about/media/
  baseURL: https://mindmazetherapeutics.com/wp-json
