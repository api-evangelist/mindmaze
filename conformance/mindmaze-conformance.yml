method: searched
source: mindmazetherapeutics.com product and about pages, plus derivation from openapi/ (2026-08-01)
scope: >-
  MindMaze Therapeutics is a regulated medical-device and digital-therapeutics manufacturer, so
  the conformance that matters to a buyer is medical-device regulatory clearance, not API
  standards. Regulatory posture is recorded first; the API/protocol block is recorded second and
  marks not-applicable rather than false where there is genuinely no surface, so this file is
  never mistaken for a compliance posture MindMaze does not claim.
regulatory:
