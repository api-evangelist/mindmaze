  conforms: true
  evidence: >-
    "The company's FDA-listed and CE-marked products are designed to address the systemic
    shortage of specialized clinicians" - MindMaze Therapeutics about page.
  source: https://mindmazetherapeutics.com/about/mindmaze-therapeutics/
  note: >-
    MindMaze states FDA listing on its own about page. This pipeline did not independently verify
    a specific 510(k) number or device listing record; the claim is recorded as published by the
    provider.
- id: ce-marked
  name: EU CE marking
  conforms: true
