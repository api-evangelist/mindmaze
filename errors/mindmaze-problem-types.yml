problems:
- code: rest_invalid_param
  status: 400
  title: One or more query parameters failed validation
  detail: >-
    Returned when a query parameter is outside its allowed range or enum. data.params carries a
    human-readable message per offending parameter and data.details carries a nested error
    object per parameter.
  remediation: Correct the named parameter. per_page must be between 1 and 100 inclusive.
  observed: 'GET /wp/v2/posts?per_page=999 on 2026-08-01'
  source_operation: openapi/mindmaze-content-openapi.yml#listPosts
- code: rest_post_invalid_id
  status: 404
  title: Invalid post ID
  detail: The numeric id in the path does not resolve to a published object of that type.
  remediation: List the collection first and use an id returned by it.
  observed: 'GET /wp/v2/posts/999999999 on 2026-08-01'
  source_operation: openapi/mindmaze-content-openapi.yml#getPost
- code: rest_no_route
  status: 404
  title: No route was found matching the URL and request method
  detail: The path is not a registered route in any namespace, or the method is not allowed on it.
  remediation: Check the route against the discovery document at /wp-json/.
  observed: 'GET /wp/v2/nope on 2026-08-01'
  source_operation: openapi/mindmaze-content-openapi.yml#getApiIndex
- code: rest_forbidden
  status: 401
  title: Sorry, you are not allowed to do that
  detail: >-
    Returned for administrative routes that exist on the host but require an authenticated
    WordPress user - settings, themes, plugins, menus, block-types, widgets and all write
    methods. These routes are deliberately excluded from the captured OpenAPI.
  remediation: >-
    Not remediable by a public caller. No public credential is issued; WordPress Application
    Passwords are administrator-only.
  observed: 'GET /wp/v2/settings, /wp/v2/themes, /wp/v2/plugins, /wp/v2/menus, /wp/v2/block-types
    on 2026-08-01'
notes: >-
  MindMaze Therapeutics publishes no error reference documentation. Every entry above was
  observed live against https://mindmazetherapeutics.com/wp-json on 2026-08-01; the code
  strings are WordPress core codes.
